<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlightHunterAI</title>

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body>

<div class="hero">

    <div class="overlay"></div>

    <div class="contenedor">

        <header class="header">

            <h1>✈ FlightHunterAI</h1>

            <p>
                Encuentra el mejor vuelo usando inteligencia artificial.
            </p>

            <div class="stats">

                <div class="stat">
                    🌎
                    <span>200+ Aerolíneas</span>
                </div>

                <div class="stat">
                    🤖
                    <span>Comparación Inteligente</span>
                </div>

                <div class="stat">
                    ⚡
                    <span>Resultados en segundos</span>
                </div>

            </div>

        </header>


        <section class="buscador">

            <form id="busqueda">

                <div class="campo">

                    <label>Origen</label>

                    <input
                        id="origen"
                        placeholder="Guadalajara o GDL"
                        required
                        autocomplete="off">

                    <div id="sugerenciasOrigen" class="sugerencias"></div>

                </div>

                <div class="campo">

                    <label>Destino</label>

                    <input
                        id="destino"
                        placeholder="Tokio o NRT"
                        required
                        autocomplete="off">

                    <div id="sugerenciasDestino" class="sugerencias"></div>

                </div>

                <div class="fila">

                    <div class="campo">

                        <label>Salida</label>

                        <input
                            type="date"
                            id="fecha_salida"
                            required>

                    </div>

                    <div class="campo">

                        <label>Regreso</label>

                        <input
                            type="date"
                            id="fecha_regreso">

                    </div>

                    <div class="campo pequeno">

                        <label>Pasajeros</label>

                        <input
                            type="number"
                            id="adultos"
                            value="1"
                            min="1">

                    </div>

                </div>

                <button class="btn-buscar">

                    🔍 Buscar mejores vuelos

                </button>

            </form>

        </section>

        <section id="panelIA" class="panel-ia oculto">

            <div class="ia-icono">

                🤖

            </div>

            <div>

                <h2>FlightHunterAI está analizando cientos de vuelos...</h2>

                <p id="estadoIA">

                    Comparando precios entre proveedores.

                </p>

            </div>

        </section>

        <section id="resultados"></section>

    </div>

</div>

<script src="/static/js/app.js"></script>

</body>

</html>
